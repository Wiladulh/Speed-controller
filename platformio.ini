[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    h2zero/NimBLE-Arduino@^2.3.0
    elims/PsychicMqttClient@^0.2.4

[env:esp32dev]
board = esp32dev
build_flags = -std=gnu++17

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
build_flags =
    -std=gnu++17
    -DBOARD_PROFILE_ESP32_S3

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
build_flags =
    -std=gnu++17
    -DBOARD_PROFILE_ESP32_C3

[env:native]
platform = native
framework =
build_flags = -std=c++17 -Iinclude
build_src_filter = +<ble/ItagClickSequence.cpp>
lib_deps =
