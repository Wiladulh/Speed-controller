name: Firmware Build

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32dev
          - esp32-s3-devkitc-1
          - esp32-c3-devkitm-1
          - esp32-c3-super-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO and certificate build dependency
        run: python -m pip install --upgrade platformio cryptography

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Prepare ESP32-C3 Super Mini firmware file
        if: matrix.environment == 'esp32-c3-super-mini'
        run: |
          mkdir -p dist
          cp .pio/build/esp32-c3-super-mini/firmware.bin dist/esp32-c3-super-mini.bin

      - name: Upload ESP32-C3 Super Mini firmware
        if: matrix.environment == 'esp32-c3-super-mini'
        uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-super-mini-firmware
          path: dist/esp32-c3-super-mini.bin
          if-no-files-found: error
          retention-days: 14

      - name: Run native click sequence tests
        if: matrix.environment == 'esp32dev'
        run: pio test -e native
